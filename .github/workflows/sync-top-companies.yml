name: Sync Top-20 KSE-100 Companies

# Scrapes the PSX data portal daily for the top-20 KSE-100 constituents by
# index weight and upserts them into the database.  Runs at 17:00 PKT (12:00
# UTC) every day so the list reflects the latest weighting after market close.

on:
  schedule:
    # 12:00 UTC = 17:00 PKT (UTC+5), daily.
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: sync-top-companies
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Verify DATABASE_URL is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it under Settings → Secrets → Actions."
            exit 1
          fi
        working-directory: .

      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # --pre required for the psxdata pre-release package.
        run: pip install -e . --pre

      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub \
            | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      - name: Sync top-20 companies from PSX
        run: python -m scripts.sync_top_companies
