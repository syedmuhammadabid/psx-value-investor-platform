name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: psx
          POSTGRES_PASSWORD: psx
          POSTGRES_DB: psx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U psx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://psx:psx@localhost:5432/psx_test
      ENVIRONMENT: test
      SECRET_KEY: test-secret-key

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (Ruff)
        run: ruff check .

      - name: Format check (Black)
        run: black --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Tests
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
