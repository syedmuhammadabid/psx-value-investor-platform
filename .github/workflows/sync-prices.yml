name: Sync PSX Prices

# Refreshes company last-traded prices by calling PSX directly via the
# psxdata library.  Runs every day at 17:00 PKT (12:00 UTC) so the latest
# closing price is captured after the PSX session ends.  The sync is
# idempotent, so re-runs and manual triggers are safe.

on:
  schedule:
    # 12:00 UTC = 17:00 PKT (UTC+5), daily.
    - cron: "0 12 * * *"
  workflow_dispatch:

concurrency:
  group: sync-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # Set this repository secret to the production connection string
      # (postgresql+psycopg://user:pass@host:5432/db).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Verify DATABASE_URL is configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL repository secret is not set. Add it under Settings → Secrets → Actions."
            exit 1
          fi
        working-directory: .

      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # --pre is required because psxdata is currently a pre-release package.
        run: pip install -e . --pre

      - name: Sync prices from PSX
        run: python -m scripts.sync_prices
